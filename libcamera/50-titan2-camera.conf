# WirePlumber 0.5 (Titan 2) -> /etc/wireplumber/wireplumber.conf.d/50-titan2-camera.conf
# Cameras reach PipeWire through libcamera (simple pipeline + software ISP). The V4L2 monitor
# would also offer the raw CAMSV capture nodes (/dev/videoN: CSI-2 Bayer, media-controller
# centric, no ISP) as cameras that apps cannot use, so it is disabled.
wireplumber.profiles = {
  main = {
    monitor.libcamera = optional
    monitor.v4l2 = disabled
  }
}

# The three cameras of the -all DTB (mt6878-unihertz-titan2-cameras.dtsi). Node names come
# from the libcamera camera id (the DT path): libcamera_input._base_soc_0_i2c_<bus>_camera_<addr>. Without these rules both rear
# cameras are "Built-in Back Camera" (GNOME Snapshot tells cameras apart by that name and
# remembers the last one by it), and WirePlumber makes the front camera the PipeWire default
# video source (priority 800 front > 750 back). Here: distinct names, main camera first.
monitor.libcamera.rules = [
  {
    # IMX766, main rear camera (i2c8 0x1a): the default video source
    matches = [ { node.name = "~libcamera_input.*11e03000.*camera_1a.*" } ]
    actions = { update-props = { node.description = "Back Camera", priority.session = 1000 } }
  }
  {
    # Hi-847, second rear camera (i2c7 0x20). Set node.disabled = true to hide it: Snapshot then
    # shows the front/back toggle (two cameras) instead of a camera list (three).
    matches = [ { node.name = "~libcamera_input.*11e02000.*camera_20.*" } ]
    actions = { update-props = { node.description = "Back Camera 2 (Hi-847)", priority.session = 800 } }
  }
  {
    # S5KGD1SP, front camera (i2c4 0x2d)
    matches = [ { node.name = "~libcamera_input.*11c23000.*camera_2d.*" } ]
    actions = { update-props = { node.description = "Front Camera", priority.session = 900 } }
  }
]
